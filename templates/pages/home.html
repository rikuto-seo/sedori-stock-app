{% extends 'base.html' %}

{% block title %}新規仕入れ{% endblock %}

{% block content %}

<div class="purchase-page">

    <!-- スキャンボタン -->
    <button type="button" class="scan-button">
        📷 バーコードをスキャン
    </button>

    <!-- スキャナー -->
    <div id="scanner-container" class="scanner-container">

        <div id="reader"></div>

        <button type="button" id="close-scanner" class="close-scanner">
            閉じる
        </button>

    </div>

    <form id="book-form">

        <!-- 商品情報 -->
        <div class="card">

            <div class="card-header">
                商品情報
            </div>

            <!-- ISBN -->
            <div class="form-group">

                <label>
                    ISBN
                </label>

                <div class="input-prefix-group">

                    <span class="input-prefix">
                        978
                    </span>

                    <input type="text" name="isbn" id="isbn-input" placeholder="xxxxxxxxxx" maxlength="10"
                        inputmode="numeric">

                </div>

            </div>

            <!-- タイトル -->
            <div class="form-group">

                <label>
                    タイトル
                </label>

                <input type="text" name="title" placeholder="タイトルを入力" required>

            </div>

            <!-- Cコード -->
            <div class="form-group">

                <label>
                    Cコード
                </label>

                <div class="input-prefix-group">

                    <span class="input-prefix">
                        C
                    </span>

                    <input type="text" name="c_code" id="c-code-input" placeholder="0077" maxlength="4"
                        inputmode="numeric">

                </div>

                <small class="input-help">
                    入力すると販売対象・形態・ジャンルを自動入力
                </small>

            </div>

            <!-- 出版社 -->
            <div class="form-group">

                <label>
                    出版社
                </label>

                <input type="text" name="publisher" id="publisher-input" list="publisher-list" placeholder="出版社を入力">

                <datalist id="publisher-list">

                    <option value="講談社">
                    <option value="集英社">
                    <option value="小学館">
                    <option value="KADOKAWA">
                    <option value="白泉社">
                    <option value="秋田書店">
                    <option value="スクウェア・エニックス">
                    <option value="技術評論社">
                    <option value="SBクリエイティブ">
                    <option value="翔泳社">

                </datalist>

            </div>

            <!-- ジャンル -->
            <div class="form-group">

                <label>
                    ジャンル
                </label>

                <input type="text" name="genre" id="genre-input" placeholder="自動入力">

            </div>

            <!-- 形態 -->
            <div class="form-group">

                <label>
                    形態
                </label>

                <input type="text" name="book_format" id="format-input" placeholder="自動入力">

            </div>

            <!-- 販売対象 -->
            <div class="form-group">

                <label>
                    販売対象
                </label>

                <input type="text" name="target" id="target-input" placeholder="自動入力">

            </div>

        </div>

        <!-- 仕入れ情報 -->
        <div class="card">

            <div class="card-header">
                仕入れ情報
            </div>

            <!-- 仕入れ値 -->
            <div class="form-group">

                <label class="important-label">
                    仕入れ値
                </label>

                <input type="number" name="purchase_price" class="important-input" placeholder="0" required>

            </div>

            <!-- 仕入れ店舗 -->
            <div class="form-group">

                <label>
                    仕入れ店舗
                </label>

                <input type="text" name="purchase_store" list="store-list" placeholder="BOOKOFF大宮">

                <datalist id="store-list">

                    <option value="BOOKOFF">
                    <option value="BOOKOFF SUPER BAZAAR">
                    <option value="駿河屋">
                    <option value="TSUTAYA">
                    <option value="古本市場">
                    <option value="ブックマーケット">

                </datalist>

            </div>

            <!-- 仕入れ日 -->
            <div class="form-group">

                <label>
                    仕入れ日
                </label>

                <input type="date" name="purchase_date" required>

            </div>

        </div>

        <!-- 下固定登録ボタン -->
        <div class="submit-container">

            <button type="submit" class="submit-button">
                登録する
            </button>

        </div>

    </form>

</div>

<script>

    document.addEventListener(
        "DOMContentLoaded",
        () => {

            /* =========================
               今日の日付
            ========================= */

            const dateInput =
                document.querySelector(
                    'input[name="purchase_date"]'
                );

            if (dateInput) {

                dateInput.valueAsDate =
                    new Date();

            }


            /* =========================
               出版社保存
            ========================= */

            const publisherInput =
                document.getElementById(
                    "publisher-input"
                );

            const publisherList =
                document.getElementById(
                    "publisher-list"
                );

            const savedPublishers =
                JSON.parse(
                    localStorage.getItem(
                        "publishers"
                    ) || "[]"
                );

            savedPublishers.forEach(
                (publisher) => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        publisher;

                    publisherList.appendChild(
                        option
                    );

                }
            );

            /* =========================
       ISBN自動取得
    ========================= */

            const isbnInput =
                document.getElementById(
                    "isbn-input"
                );

            const titleInput =
                document.querySelector(
                    'input[name="title"]'
                );

            const cCodeInput =
                document.getElementById(
                    "c-code-input"
                );

            if (isbnInput) {

                isbnInput.addEventListener(
                    "input",
                    async () => {

                        const isbn =
                            isbnInput.value.trim();

                        // 10桁入力時のみ
                        if (isbn.length !== 10) {
                            return;
                        }

                        try {

                            const fullIsbn =
                                "978" + isbn;

                            const response =
                                await fetch(
                                    `https://api.openbd.jp/v1/get?isbn=${fullIsbn}`
                                );

                            const result =
                                await response.json();

                            const book =
                                result[0];

                            if (!book) {
                                return;
                            }

                            // =========================
                            // タイトル
                            // =========================

                            if (
                                book.summary
                                && book.summary.title
                            ) {

                                titleInput.value =
                                    book.summary.title;

                            }

                            // =========================
                            // 出版社
                            // =========================

                            if (
                                book.summary
                                && book.summary.publisher
                            ) {

                                publisherInput.value =
                                    book.summary.publisher;

                            }

                            // =========================
                            // Cコード
                            // =========================

                            if (
                                book.summary
                                && book.summary.cno
                            ) {

                                cCodeInput.value =
                                    book.summary.cno;

                                // Cコード解析実行
                                cCodeInput.dispatchEvent(
                                    new Event("input")
                                );

                            }

                        } catch (error) {

                            console.error(
                                "ISBN取得失敗",
                                error
                            );

                        }

                    }
                );

            }


            /* =========================
               フォーム送信時
            ========================= */

            const bookForm =
                document.getElementById(
                    "book-form"
                );

            bookForm.addEventListener(
                "submit",
                (e) => {

                    const publisher =
                        publisherInput.value.trim();

                    if (
                        publisher &&
                        !savedPublishers.includes(
                            publisher
                        )
                    ) {

                        savedPublishers.push(
                            publisher
                        );

                        localStorage.setItem(
                            "publishers",
                            JSON.stringify(
                                savedPublishers
                            )
                        );

                    }

                }
            );

        }
    );

</script>

{% endblock %}
