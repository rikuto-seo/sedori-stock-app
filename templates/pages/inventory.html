{% extends 'base.html' %}

{% block title %}在庫一覧{% endblock %}

{% block content %}

<div class="inventory-page">

    <h1 class="page-title">
        在庫一覧
    </h1>

    <!-- フィルター -->
    <div class="filter-container">

        <input
            type="text"
            id="search-input"
            placeholder="タイトル・ISBN検索"
        >

        <select id="status-filter">
            <option value="">すべての状態</option>
            <option value="未出品">未出品</option>
            <option value="出品中">出品中</option>
            <option value="売却済">売却済</option>
        </select>

    </div>

    <!-- 件数 -->
    <div class="inventory-count">
        <span id="book-count">0</span> 件
    </div>

    <!-- 一覧 -->
    <div
        id="inventory-table"
        class="inventory-table"
    ></div>

</div>


<!-- 詳細モーダル -->
<div id="detail-modal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>詳細編集</h2>

            <button
                type="button"
                class="close-modal"
                onclick="closeDetailModal()"
            >
                ✕
            </button>

        </div>

        <form id="detail-form">

            <input type="hidden" id="detail-id">

            <div class="form-group">
                <label>タイトル</label>
                <input type="text" id="detail-title">
            </div>

            <div class="form-group">
                <label>ISBN</label>
                <input type="text" id="detail-isbn">
            </div>

            <div class="form-group">
                <label>出版社</label>
                <input type="text" id="detail-publisher">
            </div>

            <div class="form-group">
                <label>ジャンル</label>
                <input type="text" id="detail-genre">
            </div>

            <div class="form-group">
                <label>仕入れ値</label>
                <input type="number" id="detail-purchase-price">
            </div>

            <div class="form-group">
                <label>仕入れ店舗</label>
                <input type="text" id="detail-purchase-store">
            </div>

            <div class="form-group">
                <label>Cコード</label>
                <input type="text" id="detail-c-code">
            </div>

            <div class="form-group">
                <label>メモ</label>
                <textarea id="detail-memo"></textarea>
            </div>

            <button
                type="submit"
                class="save-button"
            >
                保存
            </button>

        </form>

    </div>

</div>


<!-- 販売モーダル -->
<div id="sale-modal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>販売入力</h2>

            <button
                type="button"
                class="close-modal"
                onclick="closeSaleModal()"
            >
                ✕
            </button>

        </div>

        <form id="sale-form">

            <input type="hidden" id="sale-id">

            <div class="form-group">
                <label>販売価格</label>
                <input type="number" id="sale-price">
            </div>

            <div class="form-group">
                <label>手数料</label>
                <input type="number" id="sale-fee">
            </div>

            <div class="form-group">
                <label>配送料</label>
                <input type="number" id="sale-shipping">
            </div>

            <div class="form-group">
                <label>販売日</label>
                <input type="date" id="sale-date">
            </div>

            <div class="form-group">
                <label>配送方法</label>
                <input type="text" id="shipping-method">
            </div>

            <div class="form-group">
                <label>状態</label>

                <select id="sale-status">
                    <option value="未出品">未出品</option>
                    <option value="出品中">出品中</option>
                    <option value="売却済">売却済</option>
                </select>

            </div>

            <button
                type="submit"
                class="save-button"
            >
                保存
            </button>

        </form>

    </div>

</div>

{% endblock %}
