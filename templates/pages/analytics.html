{% extends 'base.html' %}

{% block title %}
分析
{% endblock %}

{% block content %}

<div class="purchase-page">

    <h1 class="page-title">
        分析
    </h1>

    <div class="analytics-grid" id="summary-cards">
    </div>

    <!-- 月別推移 -->
    <div class="card chart-large accordion">

        <div class="card-header">
            月別推移
        </div>

        <div class="accordion-content">
            <div class="chart-filter">

                <button class="period-btn active" data-period="6m">
                    半年
                </button>

                <button class="period-btn" data-period="1y">
                    1年
                </button>

                <button class="period-btn" data-period="all">
                    すべて
                </button>

            </div>
            <canvas id="monthlyChart"></canvas>
        </div>

    </div>

    <!-- ジャンル別利益 -->
    <div class="card chart-large accordion">

        <div class="card-header">
            ジャンル別利益
        </div>

        <div class="accordion-content">
            <canvas id="genreProfitChart"></canvas>
        </div>

    </div>

    <!-- 在庫状態 -->
    <div class="card chart-large accordion">

        <div class="card-header">
            在庫状態
        </div>

        <div class="accordion-content">
            <canvas id="statusChart"></canvas>
        </div>

    </div>

    <!-- 回転日数 -->
    <div class="card chart-wide accordion">

        <div class="card-header">
            回転日数
        </div>

        <div class="accordion-content">

            <div class="accordion-inner">

                <div id="rotation-stats" class="rotation-stats">
                </div>

            </div>

        </div>

    </div>

    <!-- 利益率ランキング -->
    <div class="card chart-large accordion">

        <div class="card-header">
            利益率ランキング
        </div>

        <div class="accordion-content">
            <div id="profit-ranking">
            </div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/static/js/analytics.js"></script>

{% endblock %}
